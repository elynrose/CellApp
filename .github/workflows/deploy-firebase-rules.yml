# Deploys Firestore + Storage security rules when rule files change on main.
#
# Setup (once per repo): GitHub → Settings → Secrets and variables → Actions
#   Add secret: FIREBASE_TOKEN
#   Create token locally: npx firebase-tools login:ci
#   (Use a CI service account with Firebase deploy permissions if you prefer.)

name: Deploy Firebase rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Deploy Firestore and Storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@13 deploy --only firestore:rules,storage --non-interactive
